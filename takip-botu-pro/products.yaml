# ============== GENEL AYARLAR ==============
settings:
  phone: "90XXXXXXXXXX"          # WhatsApp numaran (başında + olmadan, ülke koduyla)
  whatsapp_web: true             # Ana kanal: WhatsApp Web (ilk açılışta QR okut)
  callmebot_apikey: ""           # YEDEK kanal (önerilir): callmebot.com'dan ücretsiz al
  headless: false                # QR okutup oturum açtıktan sonra true yapabilirsin
  max_concurrency: 3             # Aynı anda kaç ürün kontrol edilsin
  heartbeat_hour: 9              # Her gün bu saatte "bot yaşıyor" + fiyat özeti (kapatmak: null)
  min_gap_per_host_seconds: 25   # Aynı siteye iki istek arasındaki minimum saniye
  sanity_guard: true             # Şüpheli (anormal düşük) fiyatı ikinci okumayla doğrula
  renotify_drop_pct: 3           # Cooldown içinde fiyat bu % kadar daha düşerse yine bildir
  error_alert_streak: 5          # Ürün üst üste bu kadar okunamazsa uyarı mesajı at

# ============== ÜRÜNLER ==============
