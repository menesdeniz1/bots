# ============== GENEL AYARLAR ==============
settings:
  # --- Telegram (BİRİNCİL kanal) ---
  # KOLAY YOL: bu iki alanı BOŞ bırak → kur.bat'a çift tıkla (veya
  # "python takip_botu_pro.py kur") → sihirbaz soru-cevapla bağlar,
  # ayarları kurulum.yaml'a kendisi yazar. Elle doldurmak istersen:
  # @BotFather'dan token al, botuna /start yaz, "chatid" komutuyla id'ni öğren.
  telegram_bot_token: ""
  telegram_chat_id: ""

  # --- CallMeBot (YEDEK kanal, isteğe bağlı — WhatsApp'a düşer) ---
  callmebot_apikey: ""           # callmebot.com'dan ücretsiz al
  phone: "90XXXXXXXXXX"          # sadece CallMeBot yedeği için (başında + olmadan)

  headless: true                 # Telegram sayesinde QR yok → tam headless çalışır
  max_concurrency: 3             # Aynı anda kaç ürün kontrol edilsin
  heartbeat_hour: 9              # Her gün bu saatte "bot yaşıyor" + fiyat özeti (kapatmak: null)
  min_gap_per_host_seconds: 25   # Aynı siteye iki istek arasındaki minimum saniye
  sanity_guard: true             # Şüpheli (anormal düşük) fiyatı ikinci okumayla doğrula
  renotify_drop_pct: 3           # Cooldown içinde fiyat bu % kadar daha düşerse yine bildir
  error_alert_streak: 5          # Ürün üst üste bu kadar okunamazsa uyarı mesajı at
  low30_alert: true              # Hedefe inmese bile "son 30 günün en düşüğü" bilgisi gönder
  low30_min_days: 7              # Bu sinyal için en az kaç günlük veri birikmiş olmalı
  low30_cooldown_minutes: 1440   # İki 30-gün-dibi mesajı arası minimum süre (dk)
  weekly_chart_day: 0            # Haftalık grafik PNG günü: 0=Pzt ... 6=Paz (kapatmak: null)

# ============== ÜRÜNLER ==============
# mode: price (PC parçası) | stock (beden takibi) | price+stock
# sleep_min/max: saniye cinsinden kontrol aralığı (ürün başına)
#
# ÇOKLU KAYNAK (Akakçe birincil kurgusu):
#   "url" yerine "urls" listesi ver → bot HEPSİNİ kontrol eder, EN UCUZUNU bildirir.
#   İlk sıraya ürünün Akakçe linkini koy: tüm satıcıların en ucuzu tek sayfadadır,
#   böylece site site gezmeden fırsatı yakalarsın; mağaza linki de yedek kaynak olur.
#   Örnek:
#   - label: "AMD Ryzen 7 7800X3D"
#     urls:
#       - "https://www.akakce.com/islemci/en-ucuz-amd-ryzen-7-7800x3d-fiyati,XXXXXXX.html"
#       - "https://www.amazon.com.tr/dp/B0CJML6LQZ"
#     mode: price
#     price_threshold_tl: 13500
#
# NOT: Her ürünün Akakçe linkini akakce.com'da aratıp "urls" listesinin başına ekle.
